<!DOCTYPE html>
<html>
<head>
  <title>Coxeter Graph Builder</title>
  <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
  <style>
    #network { width: 600px; height: 400px; border: 1px solid gray; }
    #output { width: 600px; height: 200px; }
  </style>
</head>
<body>
  <h3>Coxeter Graph Builder</h3>
  <button onclick="startAddNode()">Add a leaf</button>
  <button onclick="startAddEdge()">Add an edge</button>
  <button onclick="exportCode()">Export Sage Code</button>

  <div id="network"></div>
  <textarea id="output"></textarea>

  <script>
    const nodes = new vis.DataSet([{ id: 's1', label: '1' }, { id: 's2', label: '2' }]);
    const edges = new vis.DataSet([{ from: 's1', to: 's2', label: '3' }]);
    const container = document.getElementById('network');
    const data = { nodes, edges };
    const network = new vis.Network(container, data, { physics: false });

    let mode = null;
    let selected = [];

    function startAddNode() { mode = 'add_node'; selected = []; }
    function startAddEdge() { mode = 'add_edge'; selected = []; }

    network.on('click', (params) => {
      if (params.nodes.length === 0) return;
      const clicked = params.nodes[0];

      if (mode === 'add_node') {
        const newId = 's' + (nodes.length + 1);
        nodes.add({ id: newId, label: (nodes.length + 1).toString() });
        edges.add({ from: clicked, to: newId, label: '3' });
        mode = null;
      } 
      else if (mode === 'add_edge') {
        selected.push(clicked);
        if (selected.length === 2) {
          // Check if edge already exists
          const existingEdge = edges.get().find(e => 
            (e.from === selected[0] && e.to === selected[1]) || 
            (e.from === selected[1] && e.to === selected[0])
          );
          
          if (existingEdge) {
            // Increment existing label by 1
            const newLabel = (parseInt(existingEdge.label) + 1).toString();
            edges.update({ id: existingEdge.id, label: newLabel });
          } else {
            // Add new edge with label 3
            edges.add({ from: selected[0], to: selected[1], label: '3' });
          }
          selected = [];
          mode = null;
        }
      }
    });

    function exportCode() {
      const lines = [
        "a2 = CoxeterType(['A', 2]).coxeter_graph()",
        "g = a2.copy()"
      ];
      const edgeArr = edges.get();
      const nodeArr = nodes.get();

      nodeArr.slice(2).forEach(n => {
        lines.push(`g.add_vertex('${n.id}')`);
      });

      edgeArr.forEach(e => {
        lines.push(`g.add_edge('${e.from}', '${e.to}', label=${e.label})`);
      });

      document.getElementById('output').value = lines.join('\n');
    }
  </script>
</body>
</html>
